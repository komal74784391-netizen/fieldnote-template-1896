<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body>
    <header>
      <strong>{{ site.author.name }}</strong>
      <nav>
        {% for item in site.nav %}<a href="{{ item.url }}">{{ item.name }}</a>{% endfor %}
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer>Built with the Fieldnote template.</footer>
  </body>
</html>
